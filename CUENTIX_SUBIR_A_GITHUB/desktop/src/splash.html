<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CUENTIX</title>
  <style>
    :root{--brand:#0F4C81;--brand2:#0B3154;--green:#20c55e;--bg:#eef3f8}
    *{box-sizing:border-box}
    body{margin:0;height:100vh;display:grid;place-items:center;background:transparent;font-family:Arial,Helvetica,sans-serif}
    .card{width:420px;height:260px;border-radius:24px;background:linear-gradient(145deg,#ffffff,#edf4fb);border:1px solid rgba(15,76,129,.16);box-shadow:0 24px 60px rgba(11,49,84,.22);display:grid;place-items:center;text-align:center;color:var(--brand2)}
    .logo{width:78px;height:78px;margin:0 auto 14px;filter:drop-shadow(0 8px 16px rgba(15,76,129,.18))}
    h1{font-size:34px;letter-spacing:.04em;margin:0;font-weight:900}
    p{margin:8px 0 22px;color:#667085;font-size:14px}
    .bar{width:180px;height:8px;border-radius:99px;background:#dbe7f3;overflow:hidden;margin:auto}
    .bar::before{content:"";display:block;width:48%;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--brand),var(--green));animation:load 1.1s ease-in-out infinite}
    @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(220%)}}
  </style>
</head>
<body>
  <div class="card">
    <div>
      <svg class="logo" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M26 12h42l28 28v54c0 8-6 14-14 14H26c-8 0-14-6-14-14V26c0-8 6-14 14-14z" fill="#fff" stroke="#0B3154" stroke-width="7" stroke-linejoin="round"/>
        <path d="M68 13v20c0 6 5 11 11 11h17" fill="none" stroke="#0B3154" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="58" text-anchor="middle" font-size="32" font-weight="800" fill="#0B3154">$</text>
        <rect x="30" y="70" width="12" height="20" rx="3" fill="#20c55e"/>
        <rect x="50" y="61" width="12" height="29" rx="3" fill="#20c55e"/>
        <rect x="70" y="49" width="12" height="41" rx="3" fill="#20c55e"/>
      </svg>
      <h1>CUENTIX</h1>
      <p>Cuentas corrientes para mini pymes y comercios.</p>
      <div class="bar"></div>
    </div>
  </div>
</body>
</html>
