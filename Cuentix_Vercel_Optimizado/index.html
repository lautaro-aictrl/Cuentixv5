    return `<div>${esc(method)}: ${money(val,currency)} <span class="money-chip">ARS</span></div>`;
  }).join('') || '<div>Sin movimientos</div>';
}
function getSortKey(name){return sessionStorage.getItem(`cuentix_sort_${name}`)||''}
function sortRows(rows, mode, type){
  const arr = [...rows];
  const text = v => String(v||'').toLowerCase();
  const num = v => Number(v||0);
  const cmp = (a,b) => a > b ? 1 : a < b ? -1 : 0;
  return arr.sort((a,b) => {
    if(type === 'invoices'){
      if(mode === 'client') return cmp(text(clientName(a.client_id)), text(clientName(b.client_id)));
      if(mode === 'pay_date') return cmp(text(a.issue_date), text(b.issue_date));
      if(mode === 'due_date') return cmp(text(a.due_date), text(b.due_date));
      if(mode === 'amount') return cmp(num(a.amount), num(b.amount));
      if(mode === 'status') return cmp(text(a.status), text(b.status));
      if(mode === 'reference') return cmp(text(a.reference), text(b.reference));
    }
    if(type === 'payments'){
      if(mode === 'client') return cmp(text(clientName(a.client_id)), text(clientName(b.client_id)));
      if(mode === 'date') return cmp(text(a.payment_date), text(b.payment_date));
      if(mode === 'method') return cmp(text(a.method), text(b.method));
      if(mode === 'currency') return cmp(text(a.currency), text(b.currency));
      if(mode === 'amount') return cmp(num(a.amount), num(b.amount));
      if(mode === 'reference') return cmp(text(a.reference), text(b.reference));
    }
    return 0;
  });
}
function sortControl(name, options){
  const current = getSortKey(name);
  return `<select class="sort-select" data-sort="${name}"><option value="">Ordenar</option>${options.map(([v,l])=>`<option value="${v}" ${current===v?'selected':''}>${l}</option>`).join('')}</select>`;

async function init(existingSession){
  if(state.booting) return;
  state.booting = true;
  const session = existingSession || (await supabase.auth.getSession()).data.session;
  state.session = session;
  if(!state.session) return showAuth();
  const { data:profile, error } = await supabase.from('profiles').select('*').eq('id',state.session.user.id).single();
  if(error || !profile?.active){ resetSessionState(); await supabase.auth.signOut(); state.booting = false; return showAuth(); }
  state.profile = profile;
  const loginSeenAt = new Date().toISOString();
  await supabase.from('profiles').update({last_seen_at:loginSeenAt,online_at:loginSeenAt}).eq('id',profile.id);
  state.profile.last_seen_at = loginSeenAt;
  state.profile.online_at = loginSeenAt;
  showApp();
  state.booting = false;
}

const rangeOptions = [
  ['today','Hoy'],['yesterday','Ayer'],['15d','Últimos 15 días'],['30d','Últimos 30 días'],['3m','Últimos 3 meses'],['6m','Últimos 6 meses'],['1y','Último año']
];
function rangeDays(value){
  return ({today:1,yesterday:1,'15d':15,'30d':30,'3m':92,'6m':184,'1y':365})[value] || 30;
}
function dateOnly(value){
  if(!value) return '';
  const d = new Date(value);
  if(Number.isNaN(d.getTime())) return String(value).slice(0,10);
  return d.toISOString().slice(0,10);
}
function labelDate(date){
  return date.toLocaleDateString('es-AR',{day:'numeric',month:'short'}).replace('.','');
}
function dateRangeWindow(range){
  const todayDate = new Date();
  todayDate.setHours(0,0,0,0);
  let end = new Date(todayDate);
  if(range === 'yesterday') end.setDate(end.getDate()-1);
  const start = new Date(end);
  start.setDate(start.getDate() - rangeDays(range) + 1);
  return {start,end};
}
function rowsByDate(rows, field){
  const map = new Map();
  (rows || []).forEach(row => {
    const key = dateOnly(row[field]);
    map.set(key,(map.get(key)||0)+toArs(row.amount,row.currency,row.exchange_rate));
  });
  return map;
}
function financialSeries(range = state.chartRange){
  const {start,end} = dateRangeWindow(range);
  const inv = rowsByDate(state.data.invoices,'issue_date');
  const pay = rowsByDate(state.data.payments,'payment_date');
  const supp = rowsByDate(state.data.supplier_payments,'payment_date');
  const days = [];
  for(let d = new Date(start); d <= end; d.setDate(d.getDate()+1)) days.push(new Date(d));
  let fact = 0, cob = 0, pag = 0;
  const points = days.map(d => {
    const key = d.toISOString().slice(0,10);
    fact += inv.get(key) || 0;
    cob += pay.get(key) || 0;
    pag += supp.get(key) || 0;
    return {date:d,label:labelDate(d),fact,cob,pag};
  });
  return points.length ? points : [{date:new Date(),label:'Hoy',fact:0,cob:0,pag:0}];
}

    <div class="card chart-card"><h2>Distribución general</h2><div class="donut"></div><div class="breakdown"><b>Facturado</b> ${money(fact)}<br><b>Cobrado</b> ${money(cob)}<br><b>Pagado</b> ${money(pag)}<br><b>Saldo pendiente</b> ${money(pend)}</div></div>

function smoothPath(points){
  if(points.length < 2) return '';
  return points.reduce((d,p,i,arr)=>{
    if(i===0) return `M ${p.x} ${p.y}`;
    const prev = arr[i-1];
    const cx = (prev.x + p.x) / 2;
    return `${d} C ${cx} ${prev.y}, ${cx} ${p.y}, ${p.x} ${p.y}`;
  },'');
}
function chartCoords(series,key,w,h,pad,max){
  return series.map((p,i)=>({
    x: pad.l + (series.length === 1 ? w/2 : i * (w - pad.l - pad.r) / (series.length - 1)),
    y: pad.t + (h - pad.t - pad.b) - (Number(p[key]||0) / max) * (h - pad.t - pad.b),
    raw:p
  }));
}
function financeChart(series,mode='compact'){
  const w = 720, h = mode === 'detail' ? 360 : 300;
  const pad = {l:64,r:24,t:26,b:42};
  const max = Math.max(1,...series.flatMap(p=>[p.fact,p.cob,p.pag]));
  const lines = [
    ['fact','#19b85f','url(#areaGreen)',mode === 'compact' ? 4.5 : 4],
    ['cob','#2f80ed','url(#areaBlue)',mode === 'compact' ? 2.4 : 3.5],
    ['pag','#8b5cf6','url(#areaPurple)',mode === 'compact' ? 2.2 : 3.5]
  ];
  const yMarks = [0,.5,1].map(v => ({y: pad.t + (1-v)*(h-pad.t-pad.b), value:max*v}));
  const step = Math.max(1,Math.floor(series.length / 6));
  const xMarks = series.filter((_,i)=>i % step === 0 || i === series.length-1);
  const paths = lines.map(([key,color,fill,width],idx) => {
    const pts = chartCoords(series,key,w,h,pad,max);
    const d = smoothPath(pts);
    const area = `${d} L ${pts.at(-1).x} ${h-pad.b} L ${pts[0].x} ${h-pad.b} Z`;
    const showArea = key === 'fact' || mode === 'detail';
    const circles = mode === 'detail' ? pts.filter((_,i)=>i%Math.max(1,Math.floor(series.length/12))===0 || i===pts.length-1).map(p=>`<circle class="chart-point" cx="${p.x}" cy="${p.y}" r="4" fill="${color}" stroke="#fff" stroke-width="2"/>`).join('') : '';
    return `${showArea?`<path class="smooth-area" d="${area}" fill="${fill}"/>`:''}<path class="smooth-path" d="${d}" stroke="${color}" stroke-width="${width}" opacity="${idx && mode==='compact'?'.42':'1'}"/>${circles}`;
  }).join('');
  const last = series.at(-1) || {fact:0,cob:0,pag:0};
  return `<div class="chart-visual" data-finance-detail><svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <defs>
      <linearGradient id="areaGreen" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#19b85f" stop-opacity=".30"/><stop offset=".62" stop-color="#19b85f" stop-opacity=".10"/><stop offset="1" stop-color="#19b85f" stop-opacity="0"/></linearGradient>
      <linearGradient id="areaBlue" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#2f80ed" stop-opacity=".18"/><stop offset="1" stop-color="#2f80ed" stop-opacity="0"/></linearGradient>
      <linearGradient id="areaPurple" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".16"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient>
      <filter id="softGlow"><feGaussianBlur stdDeviation="2.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    </defs>
    ${yMarks.map(m=>`<line class="grid-line" x1="${pad.l}" x2="${w-pad.r}" y1="${m.y}" y2="${m.y}"/><text class="axis-label" x="18" y="${m.y+4}">${compactMoney(m.value)}</text>`).join('')}
    ${paths}
    ${xMarks.map(p=>{const i=series.indexOf(p); const x = pad.l + (series.length === 1 ? (w-pad.l-pad.r)/2 : i * (w-pad.l-pad.r)/(series.length-1)); return `<text class="axis-label" x="${x-18}" y="${h-14}">${p.label}</text>`}).join('')}
  </svg><div class="chart-tooltip"><b>${money(last.fact)}</b><br><span class="small">Facturado acumulado</span></div></div>`;
}

function panel(title, toolbar, content){ return `<div class="card panel"><div class="toolbar"><h2>${title}</h2><div class="row">${toolbar}</div></div>${content}</div>`}
function emptyState(title='Sin registros todavía', text='La sección está lista. Podés comenzar usando los botones superiores.', icon='＋'){
  return `<div class="empty-state"><div class="empty-icon">${icon}</div><h3>${title}</h3><p>${text}</p></div>`;
}
function tableHtml(headers, rows){ if(!rows.length) return emptyState(); return `<div class="table-wrap"><table class="table"><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c??'-'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
function sum(rows,k){return rows.reduce((a,r)=>a+Number(r[k]||0),0)}
function sumArs(rows){return rows.reduce((a,r)=>a+toArs(r.amount,r.currency,r.exchange_rate),0)}
function toArs(amount,currency,exchangeRate=1){return Number(amount||0) * (currency === 'USD' ? Number(exchangeRate||1) : 1)}
function clientName(id){return state.data.clients.find(c=>c.id===id)?.name || '-'}
function supplierName(id){return state.data.suppliers.find(s=>s.id===id)?.name || '-'}
function rowSearchText(row){
  return Object.values(row || {}).map(v => {
    if(v == null) return '';
    if(typeof v === 'object') return JSON.stringify(v);
    return String(v);
  }).join(' ').toLowerCase();
}
function filterRows(rows, extra){
  const q = (state.search || '').trim().toLowerCase();
  if(!q) return rows || [];
  return (rows || []).filter(row => `${rowSearchText(row)} ${(extra ? extra(row) : '')}`.toLowerCase().includes(q));
}
function fileTag(path){return path ? `<span class="file-chip">Adjunto</span>` : '-'}
function actions(type,id){return `<div class="actions"><button class="btn-secondary" data-edit="${type}:${id}">Editar</button><button class="btn-danger" data-delete="${tableFor(type)}:${id}">Eliminar</button></div>`}
function tableFor(type){return {client:'clients',supplier:'suppliers',invoice:'invoices',supplier_movement:'supplier_movements',budget:'budgets'}[type]||type}
async function saveRecord(table,payload,id){
  if(table === 'supplier_movements') delete payload.exchange_rate;
  let query = id ? supabase.from(table).update(payload).eq('id',id) : supabase.from(table).insert(payload);
  let result = await query;
  if(result.error && /exchange_rate|schema cache/i.test(result.error.message || '')){
    const retryPayload = {...payload};
    delete retryPayload.exchange_rate;
    query = id ? supabase.from(table).update(retryPayload).eq('id',id) : supabase.from(table).insert(retryPayload);
    result = await query;
  }
  return result;
}

function fieldHtml(f,row){

async function uploadFile(file, folder){
  const optimized = file.type.startsWith('image/') ? await compressImage(file).catch(()=>file) : file;
  const ext = optimized.type === 'image/webp' ? 'webp' : (file.name.split('.').pop() || 'bin');
  const safeName = file.name.replace(/\.[^.]+$/,'').replace(/[^\\w.\\-]+/g,'_');
  const path = `${state.profile.business_id}/${folder}/${Date.now()}-${safeName}.${ext}`;
  const { error } = await supabase.storage.from('documents').upload(path,optimized,{contentType:optimized.type || file.type});
  if(error) throw error; return path;
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = () => {
      const max = 1600, scale = Math.min(1, max / Math.max(img.width,img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale); canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      canvas.toBlob(blob => blob ? resolve(new File([blob], file.name.replace(/\.[^.]+$/,'.webp'), {type:'image/webp'})) : reject(new Error('No se pudo optimizar imagen')), 'image/webp', .82);
    };
    img.onerror = reject; img.src = URL.createObjectURL(file);
  });
}

async function budgetItemAction(action,index){
  const arr = readBudgetItems();

    const current = arr[index]?.code || '';

    if(next !== null) arr[index].code = next.trim();
  }
  if(action==='inc') arr[index].quantity += 1;
  if(action==='dec') arr[index].quantity = Math.max(0,arr[index].quantity-1);
  if(action==='dup') arr.splice(index+1,0,{...arr[index]});
  if(action==='del') arr.splice(index,1);
  if(action==='up' && index>0) [arr[index-1],arr[index]]=[arr[index],arr[index-1]];
  if(action==='down' && index<arr.length-1) [arr[index+1],arr[index]]=[arr[index],arr[index+1]];
  if(action==='template'){
    const item = arr[index];
    if(item?.description){

}

function detectImageColor(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img,0,0,32,32);
      const data = ctx.getImageData(0,0,32,32).data;
      let r=0,g=0,b=0,c=0;
      for(let i=0;i<data.length;i+=16){ if(data[i+3] > 80){r+=data[i];g+=data[i+1];b+=data[i+2];c++;} }
      if(!c) return resolve(null);
      resolve('#' + [r/c,g/c,b/c].map(v=>Math.round(v).toString(16).padStart(2,'0')).join(''));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}
async function signedUrl(path){

  return { qty, unit, discount, priceWithDiscount, amount: qty * priceWithDiscount };
}

    table{width:100%;border-collapse:collapse;margin-top:12px}th{background:${color};color:#fff;padding:8px;border:1px solid ${color};font-size:12px;text-align:left}td{padding:8px;border:1px solid #d1d5db;font-size:12px}.totals{margin-left:auto;width:310px}.totals td:first-child{font-weight:700}.total{font-size:16px;font-weight:800;color:${color}}.terms{border:1px solid #d1d5db;padding:10px;margin-top:16px}.budget-media{margin:16px 0;border:1px solid #d1d5db;border-radius:12px;padding:10px}.budget-media img{width:100%;max-height:360px;object-fit:contain;border-radius:10px;display:block}.sign{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:56px;text-align:center}.line{border-top:1px solid #111827;padding-top:8px}.actions{margin-bottom:16px}@media print{.actions{display:none}body{padding:0}.page{max-width:none}}
  </style></head><body><div class="page"><div class="actions"><button onclick="window.print()">Imprimir / Guardar PDF</button></div>
  <div class="top"><div>${logoUrl?`<img class="logo" src="${logoUrl}">`:''}<div>${companyLines.map(esc).join('<br>')}</div></div><div class="doc"><h1>PRESUPUESTO</h1><div>N° ${esc(b.budget_number||'')}</div><div>Fecha: ${esc(b.issue_date||today())}</div></div></div>
  <div class="no-valid">DOCUMENTO NO VÁLIDO COMO FACTURA</div>
  <div class="blocks"><div class="block"><h3>Datos del cliente</h3>${clientLines.map(esc).join('<br>')}</div><div class="block"><h3>Condición de venta</h3><b>Cond. Vta.:</b> ${esc(b.payment_terms||'')}</div></div>
  ${imageUrl?`<div class="budget-media"><img src="${imageUrl}" alt="Imagen del presupuesto"></div>`:''}
  <table><thead><tr><th>Código</th><th>Descripción</th><th>Unidad</th><th>Cantidad</th><th>Precio unitario</th>${discountHeaders}<th>Importe</th></tr></thead><tbody>${rows}</tbody></table>
  <table class="totals"><tr><td>Subtotal</td><td>${money(subtotal,currency)}</td></tr><tr><td>IVA ${Number(b.iva||0)}%</td><td>${money(ivaAmount,currency)}</td></tr><tr><td class="total">Total</td><td class="total">${money(total,currency)}</td></tr></table>
  <div class="terms">Condiciones de pago: ${esc(b.payment_terms||'')}</div><div class="sign"><div class="line">Firma de la Empresa</div><div class="line">Firma del Cliente</div></div></div></body></html>`);
  win.document.close();
}
function closeModal(){
  const btn = byId('modalForm').querySelector('.btn-primary');
  if(btn){ btn.disabled = false; btn.textContent = 'Guardar'; }
  byId('modal').classList.remove('open');
  byId('modalForm').reset();
}
byId('modalClose').onclick=closeModal; byId('modalCancel').onclick=closeModal; byId('modal').onclick=e=>{if(e.target.id==='modal')closeModal();}

function downloadCsv(filename, rows){ if(!rows?.length) return alert('Sin datos para exportar.'); const keys=Object.keys(rows[0]); const csv=[keys.join(','),...rows.map(r=>keys.map(k=>`"${String(r[k]??'').replaceAll('"','""')}"`).join(','))].join('\\n'); const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'})); a.download=filename; a.click(); URL.revokeObjectURL(a.href); }
setInterval(()=>{ if(state.profile) supabase.from('profiles').update({online_at:new Date().toISOString()}).eq('id',state.profile.id); },30000);
installVersionGuard();
init();
</script>
